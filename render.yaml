services:
  - type: web
    name: signal-churn-dashboard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SIGNAL_STORAGE_PERSISTENT
        value: "false"
